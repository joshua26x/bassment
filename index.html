<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BASSMENT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="overlay"></div>

    <header>
        <h1 class="logo flicker">
            <span>BASS</span><span>MENT</span>
        </h1>
        <p class="tagline">Feel the Bass. Fuel the Chaos.</p>
    </header>

    <section class="products">
        <div class="products-grid">

            <div class="product-card">
                <img src="images/product1.jpg" alt="Headphones">
                <h3>Underground Headphones</h3>
                <p>$129</p>
                <button onclick="addToCart('Headphones',129)">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="images/product2.jpg" alt="Gaming Gear">
                <h3>Street Gaming Rig</h3>
                <p>$899</p>
                <button onclick="addToCart('Gaming Rig',899)">Add to Cart</button>
            </div>

        </div>
    </section>

    <div class="cart-panel" id="cartPanel">
        <h2>Cart</h2>
        <ul id="cartItems"></ul>
        <p id="cartTotal">Total: $0</p>
        <button onclick="toggleCart()">Close</button>
    </div>

    <button class="cart-button" onclick="toggleCart()">Cart</button>

    <script src="script.js"></script>
</body>
</html>
